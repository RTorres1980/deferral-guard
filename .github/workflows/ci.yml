name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Sample SQL is in sync with CSV fixtures
        run: |
          python scripts/build_sample_sql.py
          git diff --exit-code db/06_sample_data.sql
      - name: Demo run
        run: python -m deferral_guard run --data data/sample --out reports
